[package]
name = "time-series-library-rust"
version = "0.1.0"
edition = "2021"

[dependencies]
burn = { version = "0.16.0", features = ["wgpu", "train"] }
burn-ndarray = "0.16.0"
burn-wgpu = "0.16.0"
tokio = { version = "1.0", features = ["full"] }
clap = { version = "4.0", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
anyhow = "1.0"
rand = "0.8"
csv = "1.3"
ndarray = "0.15"
